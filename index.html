<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مدرسة شبرا بلولة للتعليم الأساسي</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="cap" viewBox="0 0 24 24">
        <path d="M22 10 12 5 2 10l10 5 10-5z" />
        <path d="M6 12v5c3 2 9 2 12 0v-5" />
      </symbol>
      <symbol id="pin" viewBox="0 0 24 24">
        <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z" />
        <circle cx="12" cy="10" r="3" />
      </symbol>
      <symbol id="sr" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="m21 21-4.3-4.3" />
      </symbol>
      <symbol id="star" viewBox="0 0 24 24">
        <path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2-6.2 3.2L7 14.2 2 9.3l6.9-1z" />
      </symbol>
      <symbol id="us" viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="4" />
        <path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.6" />
      </symbol>
      <symbol id="bd" viewBox="0 0 24 24">
        <path d="M6 22V3h12v19M3 22h18M10 7h1M13 7h1M10 11h1M13 11h1M10 15h4v7" />
      </symbol>
      <symbol id="bk" viewBox="0 0 24 24">
        <path d="M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h14" />
      </symbol>
      <symbol id="fl" viewBox="0 0 24 24">
        <path d="M9 3h6M10 3v6L4 20h16L14 9V3" />
      </symbol>
      <symbol id="pc" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="12" rx="2" />
        <path d="M8 20h8M12 16v4" />
      </symbol>
      <symbol id="tr" viewBox="0 0 24 24">
        <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3" />
      </symbol>
      <symbol id="hd" viewBox="0 0 24 24">
        <path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z" />
      </symbol>
      <symbol id="ph" viewBox="0 0 24 24">
        <path d="M22 17v3a2 2 0 0 1-2.2 2A19 19 0 0 1 2 4.2 2 2 0 0 1 4 2h3l2 5-2.5 1.5a14 14 0 0 0 7 7L15 13l5 2z" />
      </symbol>
      <symbol id="pn" viewBox="0 0 24 24">
        <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
      </symbol>
    </defs>
  </svg>
  <header>
    <div class="wrap nav">
      <a class="logo" href="#top"><i><svg class="i">
            <use href="#cap" />
          </svg></i><span><b data-t="school.name"></b><small data-t="school.subtitle"></small></span></a>
      <nav class="links" aria-label="التنقل"><a href="#top">الرئيسية</a><a href="#levels">المراحل</a><a
          href="#facilities">المرافق</a><a href="#gallery">المعرض</a><a href="#fame">الأوائل</a><a href="#services">الخدمات</a><a
          href="#contact">تواصل معنا</a></nav>
      <a class="btn o" href="#top"><svg class="i">
          <use href="#sr" />
        </svg>استعلام عن النتائج</a>
      <a class="btn" href="#services">تقديم الطلاب الجدد</a>
    </div>
  </header>

  <div class="hero" id="top">
    <div class="hero-bg" id="heroBg"></div>
    <div class="wrap">
      <span class="pill"><svg class="i">
          <use href="#pin" />
        </svg><span data-t="school.badge"></span></span>
      <h1><span data-t="hero.title"></span><em data-t="hero.highlight"></em></h1>
      <p data-t="hero.text"></p>
      <form class="search" id="rf"><svg class="i" style="color:#64748b;margin-inline:8px 2px">
          <use href="#sr" />
        </svg><input required placeholder="استعلم عن النتيجة: رقم الجلوس أو اسم الطالب"
          aria-label="رقم الجلوس أو اسم الطالب"><button class="btn g" type="submit">استعلام</button></form>
      <div class="res" id="rr" role="status"></div>
      <div class="chips" id="chips"></div>
    </div>
    <svg class="wave" viewBox="0 0 1440 70" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 70C300 10 700 0 1000 30s340 30 440 10v30z" />
    </svg>
  </div>

  <div class="wrap stats" id="stats"></div>

  <section id="levels">
    <div class="wrap">
      <h2 data-t="sections.levels.title"></h2>
      <p class="sub" data-t="sections.levels.sub"></p>
      <div class="grid" id="levels-list"></div>
    </div>
  </section>

  <section id="facilities" class="band">
    <div class="wrap">
      <h2 data-t="sections.facilities.title"></h2>
      <p class="sub" data-t="sections.facilities.sub"></p>
      <div class="grid" id="facilities-list"></div>
    </div>
  </section>

  <section id="gallery">
    <div class="wrap">
      <h2 data-t="sections.gallery.title"></h2>
      <p class="sub" data-t="sections.gallery.sub"></p>
      <div class="gal" id="gal"></div>
    </div>
  </section>

  <section id="fame">
    <div class="wrap">
      <h2 data-t="sections.fame.title"></h2>
      <p class="sub" data-t="sections.fame.sub"></p>
      <div class="fame" id="fame-list"></div>
      <p class="note" data-t="sections.fame.note"></p>
    </div>
  </section>

  <section id="services" class="band">
    <div class="wrap">
      <h2 data-t="sections.services.title"></h2>
      <p class="sub" data-t="sections.services.sub"></p>
      <div class="two" id="services-list"></div>
    </div>
  </section>

  <section id="community">
    <div class="wrap">
      <h2 data-t="sections.community.title"></h2>
      <p class="sub" data-t="sections.community.sub"></p>
      <div class="grid" id="community-list"></div>
    </div>
  </section>

  <section id="contact" class="band">
    <div class="wrap">
      <h2 data-t="sections.contact.title"></h2>
      <p class="sub" data-t="sections.contact.sub"></p>
      <div class="two">
        <div class="card">
          <form id="cf"><input class="f" required placeholder="الاسم" aria-label="الاسم"><input class="f" required
              type="tel" placeholder="رقم الهاتف" aria-label="رقم الهاتف"><textarea class="f" required rows="4"
              placeholder="رسالتك" aria-label="رسالتك"></textarea><button class="btn" type="submit">إرسال
              الرسالة</button></form>
          <div class="ok" id="cr" role="status"></div>
        </div>
        <div class="card">
          <h3><svg class="i">
              <use href="#ph" />
            </svg> <a data-tel dir="ltr" data-t="school.phone"></a></h3>
          <p><svg class="i">
              <use href="#pin" />
            </svg> <span data-t="school.address"></span><br><span data-t="school.affiliation"></span></p>
          <p style="margin-top:16px"><a class="btn g" id="mapLink" target="_blank" rel="noopener">افتح الموقع في خرائط
              Google</a></p>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <div><b style="color:#fff" data-t="school.fullName"></b><br>© <span data-t="school.year"></span> جميع الحقوق
        محفوظة</div>
      <div><a href="#levels">المراحل</a> &nbsp; <a href="#services">التقديم</a> &nbsp; <a href="#contact">تواصل</a>
      </div>
      <div id="fb"></div>
    </div>
  </footer>

  <dialog id="lb" aria-label="عرض الصورة"><button class="lx" id="lbX" aria-label="إغلاق">×</button><button class="ln lp" id="lbP" aria-label="السابقة">›</button><button class="ln lnx" id="lbN" aria-label="التالية">‹</button><img id="lbI" alt=""><p id="lbC"></p></dialog>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
